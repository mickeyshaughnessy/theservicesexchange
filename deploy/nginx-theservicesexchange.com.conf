# Legacy domain — "We've moved" notice + path redirects
# Deploy: copy to /etc/nginx/sites-available/theservicesexchange.com && nginx -t && systemctl reload nginx
# Keeps HTTPS on the old domain so bookmarks and old app update URLs still work.

server {
    server_name theservicesexchange.com www.theservicesexchange.com;
    root /var/www/theservicesexchange;

    # Older app builds still fetch update manifest / APK from this host
    location ^~ /apk/ {
        return 301 https://therobotservicesexchange.com$request_uri;
    }

    # Homepage: friendly "We've moved" page
    location = / {
        try_files /moved.html =404;
    }
    location = /index.html {
        try_files /moved.html =404;
    }
    location = /moved.html {
        try_files /moved.html =404;
    }

    # Deep links: permanent redirect, path preserved
    location / {
        return 301 https://therobotservicesexchange.com$request_uri;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/theservicesexchange.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theservicesexchange.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.theservicesexchange.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = theservicesexchange.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name theservicesexchange.com www.theservicesexchange.com;
    return 404;
}
