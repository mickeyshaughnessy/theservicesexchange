# Public site — primary domain
# Deploy: copy to /etc/nginx/sites-available/therobotservicesexchange.com
#   && ln -sf /etc/nginx/sites-available/therobotservicesexchange.com /etc/nginx/sites-enabled/
#   && nginx -t && systemctl reload nginx
# Certs: certbot --nginx -d therobotservicesexchange.com -d www.therobotservicesexchange.com

server {
    server_name therobotservicesexchange.com www.therobotservicesexchange.com;
    root /var/www/theservicesexchange;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @backend;
    }

    # Android APK sideload (demand app)
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # App update manifest — no-cache + CORS for Capacitor WebView fetch
    location = /apk/version.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # App source/assets are not website content (robot branding lives in the APK only)
    location ^~ /mobile/ {
        return 404;
    }

    # Do not serve legacy moved page as site content on the new domain
    location = /moved.html {
        return 404;
    }

    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        proxy_pass http://localhost:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/therobotservicesexchange.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/therobotservicesexchange.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.therobotservicesexchange.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = therobotservicesexchange.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name therobotservicesexchange.com www.therobotservicesexchange.com;
    return 404;
}
