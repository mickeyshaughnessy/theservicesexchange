<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="8;url=https://therobotservicesexchange.com/">
    <title>We've moved — The RSE</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0a2e;
            --card: #12123a;
            --text: #f2f2ff;
            --muted: #a8a8c8;
            --accent: #6c8cff;
            --accent-hover: #8aa4ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #1a1a4a 0%, var(--bg) 55%);
            color: var(--text);
            padding: 1.5rem;
        }
        .card {
            width: min(36rem, 100%);
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
            padding: 2rem 1.75rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            text-align: center;
        }
        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.5rem, 4vw, 1.9rem);
            line-height: 1.25;
        }
        p {
            margin: 0 0 1rem;
            color: var(--muted);
            line-height: 1.55;
        }
        .domain {
            color: var(--text);
            font-weight: 600;
            word-break: break-word;
        }
        a.btn {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.85rem 1.25rem;
            border-radius: 0.65rem;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        a.btn:hover { background: var(--accent-hover); }
        .note {
            margin-top: 1.25rem;
            font-size: 0.9rem;
        }
        code {
            font-size: 0.92em;
            color: #d7ddff;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>We've moved</h1>
        <p>
            The Robot Services Exchange website is now at
            <span class="domain">therobotservicesexchange.com</span>.
        </p>
        <p>
            The API is unchanged:
            <code>https://rse-api.com:5003</code>
        </p>
        <a class="btn" href="https://therobotservicesexchange.com/">
            Continue to therobotservicesexchange.com
        </a>
        <p class="note">
            You will be redirected automatically in a few seconds.
        </p>
    </main>
</body>
</html>
